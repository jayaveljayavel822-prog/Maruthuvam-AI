version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: maruthuvam_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: maruthuvam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maruthuvam_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/maruthuvam
      JWT_SECRET_KEY: maruthuvam_production_secure_secret_key_2026_change_in_prod
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://127.0.0.1:3000"]'
      ENVIRONMENT: production
      STORAGE_TYPE: local
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maruthuvam_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    name: maruthuvam_postgres_data
  backend_uploads:
    name: maruthuvam_uploads
